name: Privacy verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations and seed data
        run: supabase db reset

      - name: Verify RLS and privacy boundaries
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
